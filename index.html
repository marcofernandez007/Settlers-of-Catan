
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catan Strategist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=MedievalSharp&display=swap');
        
        :root {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        
        .medieval {
            font-family: 'MedievalSharp', cursive;
        }
        
        .hex-path {
            transition: all 0.3s ease;
        }
        
        @media (hover: hover) {
            .hex-path:hover {
                filter: brightness(1.1);
            }
        }
        
        @keyframes road-pulse {
            0% { filter: drop-shadow(0 0 2px rgba(255,255,255,0.4)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 10px rgba(255,255,255,0.9)); transform: scale(1.02); }
            100% { filter: drop-shadow(0 0 2px rgba(255,255,255,0.4)); transform: scale(1); }
        }
        
        .active-road {
            animation: road-pulse 2.5s infinite ease-in-out;
            transform-origin: center;
        }
        
        @keyframes build-in {
            0% { opacity: 0; transform: scale(0.2) rotate(-10deg); }
            70% { transform: scale(1.1) rotate(5deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        
        .new-build {
            animation: build-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: center;
        }

        @keyframes dice-spin {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.1) translateY(-20px); }
            50% { transform: rotate(180deg) scale(1) translateY(0); }
            75% { transform: rotate(270deg) scale(1.1) translateY(-10px); }
            100% { transform: rotate(360deg) scale(1) translateY(0); }
        }
        
        .dice-rolling {
            animation: dice-spin 0.3s linear infinite;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Prevent zooming on inputs for iOS */
        input, select, textarea {
            font-size: 16px !important;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <svg style="position: absolute; width: 0; height: 0;">
      <defs>
        <filter id="bevel">
          <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
          <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1" specularExponent="20" lighting-color="#ffffff" result="spec">
            <fePointLight x="-50" y="-100" z="200"/>
          </feSpecularLighting>
          <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
          <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="lit"/>
        </filter>
      </defs>
    </svg>
</body>
</html>
